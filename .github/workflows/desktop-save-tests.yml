name: Desktop save safety
on:
  pull_request:
    paths:
      - 'app/desktop/**'
      - 'app/src/lib/desktop-save.ts'
      - 'app/src/lib/store.ts'
      - 'app/src/main.ts'
      - '.github/workflows/desktop-save-tests.yml'
permissions:
  contents: read
concurrency:
  group: desktop-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  save-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm --prefix app/desktop ci --ignore-scripts
      - run: npm --prefix app/desktop test

name: "Deploy: staging worker"

# The `staging` branch, and only it. PRs land here before main, and main is the
# one branch that must never be deployed by accident: wrangler.jsonc binds
# tetrilaunch.com as a custom domain and Play release builds are cut from it, so
# a workflow that fired on main would publish the live game as a side effect of
# a merge. Production deploys stay exactly as they are today — manual, from a
# person who meant it.
#
# This is a different thing from the pages.dev branch previews. Those are a
# Pages project serving the built SPA with no worker behind it, so /api/scores
# on a preview URL answers text/html, not JSON — fine for looking at layout,
# useless for anything touching the leaderboard. This workflow is what gives
# staging a real worker: the API, and its own D1 (see wrangler.jsonc's
# env.staging), so a playtest score can never land on the live board.
on:
  push:
    branches: [staging]
  # Manual re-deploy without an empty commit, e.g. after rotating the token.
  workflow_dispatch:

# A deploy is a mutation of one named worker. Two of them racing would leave
# whichever finished last live, which is not necessarily the newer commit —
# so queue rather than cancel: the in-flight one is already talking to the API.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Names the URL in the Actions UI and gives the deploy a rollback trail.
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches android.yml: the Capacitor 8 CLI floor is >=22, and using
          # one node across workflows keeps the lockfile resolution identical.
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Fail here, loudly, rather than letting wrangler fail with an auth error
      # that reads like a network problem. The token needs Workers Scripts:Edit
      # (deploy the worker) and D1:Edit (bind the database).
      #
      # Marketing has no browser billing/login bundle. Preserve the server
      # identity configuration used by installed apps' account API.
      - name: Require deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_APPLE_WEB_CLIENT_ID: ${{ secrets.VITE_APPLE_WEB_CLIENT_ID }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN VITE_GOOGLE_WEB_CLIENT_ID REVENUECAT_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set — add it under Settings → Secrets → Actions."
              exit 1
            fi
          done
          for name in VITE_GOOGLE_IOS_CLIENT_ID VITE_APPLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set — that native account provider stays unavailable until configured."
            fi
          done

      # Root `npm ci` installs wrangler itself; the app's own dependencies are
      # installed by wrangler's configured build command (wrangler.jsonc's
      # build.command -> root package.json's `build` -> npm --prefix app).
      # Deploying through `npm ci` rather than `npm install` so the wrangler
      # version is the one the lockfile pins, not whatever is newest today.
      - name: Install workspace tooling
        run: npm ci

      # --env staging is the whole point: it selects the environment block that
      # rebinds DB to tetrilaunch-leaderboard-preview. Bindings are NOT
      # inherited by a named environment, so dropping this flag would deploy a
      # worker pointed at the production leaderboard.
      #
      # Only the marketing artifact is built. Identity values below remain
      # server-side compatibility configuration for installed clients.
      #
      # Migrations are deliberately NOT run here. Applying schema changes on
      # every push means a bad migration ships without anyone deciding to ship
      # it; run `wrangler d1 migrations apply tetrilaunch-leaderboard-preview
      # --remote --env staging` when a migration is what you actually intend.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler deploy --env staging | tee "$RUNNER_TEMP/staging-deploy.log"
          node -e '
            const fs = require("node:fs");
            const log = fs.readFileSync(process.env.RUNNER_TEMP + "/staging-deploy.log", "utf8");
            const url = log.match(/https:\/\/tetrilaunch-staging\.[a-z0-9-]+\.workers\.dev/);
            if (!url) throw new Error("Wrangler did not report a staging deployment URL");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "deployment-url=" + url[0] + "\n");
          '

      # A new named Worker must exist before Wrangler can attach secrets. The
      # bulk upload creates a new Worker version immediately after the initial
      # deploy and keeps the RevenueCat secret key out of logs and config files.
      #
      # Keep the existing client-id secret names for native account requests;
      # the marketing build does not consume them.
      #
      # Built with node rather than printf: JSON-escaping becomes node's
      # problem, and an UNSET id must be ABSENT from the payload rather than
      # uploaded as "" — an empty-string secret would show up in the dashboard
      # as configured while meaning nothing, and the Worker's "is this provider
      # configured" check should read the same truth an operator does.
      - name: Configure Worker auth secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_APPLE_WEB_CLIENT_ID: ${{ secrets.VITE_APPLE_WEB_CLIENT_ID }}
        run: |
          node -e '
            const secrets = {
              REVENUECAT_SECRET_KEY: process.env.REVENUECAT_SECRET_KEY,
              GOOGLE_WEB_CLIENT_ID: process.env.VITE_GOOGLE_WEB_CLIENT_ID,
              GOOGLE_IOS_CLIENT_ID: process.env.VITE_GOOGLE_IOS_CLIENT_ID,
              APPLE_WEB_CLIENT_ID: process.env.VITE_APPLE_WEB_CLIENT_ID,
            };
            process.stdout.write(JSON.stringify(
              Object.fromEntries(Object.entries(secrets).filter(([, v]) => v)),
            ));
          ' | npx wrangler secret bulk --env staging

      - name: Verify served staging build and API
        env:
          STAGING_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/verify-staging.mjs "$STAGING_URL" "$GITHUB_SHA"

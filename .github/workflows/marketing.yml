name: Marketing distribution checks

on:
  pull_request:
    branches: [staging]
    paths:
      - 'marketing/**'
      - 'scripts/build-marketing.mjs'
      - 'tests/marketing*.mjs'
      - 'app/public/about/**'
      - 'app/public/fonts/**'
      - 'app/public/*.html'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/marketing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Build isolated public artifact
        run: node scripts/build-marketing.mjs
      - name: Distribution and retirement boundaries
        run: |
          node marketing/build.test.mjs
          node tests/marketing-distribution.mjs
          node tests/marketing-retirement.mjs
      - name: Browser routes, layout and legacy service-worker migration
        env:
          MARKETING_SCREENSHOT_DIR: ${{ runner.temp }}/marketing-screenshots
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_PATH"
          node tests/marketing-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: marketing-screenshots
          path: ${{ runner.temp }}/marketing-screenshots
          if-no-files-found: ignore
          retention-days: 7

name: iOS build & TestFlight

# Builds the signed iOS app and uploads it to TestFlight. From there App Store
# submission is a deliberate click in App Store Connect — same shape as
# android.yml, where promotion past the testing track is the irreversible half
# and stays human.
#
# THIS RUNS ONLY ON DEMAND OR A RELEASE TAG, and that is a cost decision as
# much as a hygiene one: GitHub bills macOS runner minutes at 10x Linux, so a
# per-push iOS build would drain the Actions quota faster than every other
# workflow combined. A dispatch is the rehearsal button; a v* tag is a
# release, mirroring desktop.yml.
#
# AND THE REHEARSAL BUTTON NOW REHEARSES. For its first twenty-odd runs this
# file said the sentence above and uploaded anyway: the upload step carried no
# condition at all, so run 21 — a dispatch on `main`, ticked by nobody — put
# build 21 in front of every TestFlight tester. iOS is the one platform where
# that cannot be taken back: the build number is spent, and a tester's phone
# has already offered them the update. So the upload is gated the way
# android.yml gates its Play publish, with the same `publish` input and the
# same reasoning — the Actions UI lets a dispatch pin itself to an existing v*
# tag, so the ref alone cannot be the gate.
#
# A rehearsal still does everything but ship: it archives, signs, resolves the
# App Store profile and EXPORTS, leaving the signed ipa attached to the run. The
# export is not optional to a rehearsal — it is the half where manual signing is
# actually exercised, and where run #4 failed. Only `destination` changes, from
# `upload` to `export`, and only the last stage of the pipeline is withheld.
#
# Signing: the runner holds the Apple Distribution certificate in a
# throwaway keychain and archives with MANUAL distribution signing against
# the App Store profile named "Tetrilaunch App Store", which
# -allowProvisioningUpdates downloads via the App Store Connect API key. The
# profile is created ONCE in the portal (Profiles → + → App Store Connect →
# com.tetrilaunch.game → the Distribution cert → that exact name) and never
# stored as a secret. Manual, not automatic: automatic signing archives with
# a DEVELOPMENT profile first, which wants a development cert and at least
# one registered device — neither of which a TestFlight pipeline needs, and
# run #3 failed on exactly that ("team has no devices").
#
# The manual settings live in the App target's RELEASE config in
# project.pbxproj, NOT as command-line overrides: a CLI build setting hits
# every target in the build, and Swift package resource bundles
# (GoogleUtilities and friends) refuse a provisioning profile outright —
# run #4 failed on exactly that. Debug stays Automatic so local ⌘R
# development needs none of this.
#
# The secrets live in the `ios-build` ENVIRONMENT (same reasoning as
# android-build: an environment can carry protection rules repo secrets
# cannot). The job fails at its guard steps rather than uploading a build
# with the store or sign-in silently missing:
#
#   IOS_DIST_CERT_P12         base64 of the Apple Distribution cert + private
#                             key (.p12). Keychain Access → export both items.
#   IOS_DIST_CERT_PASSWORD    the password chosen at that export
#   ASC_API_KEY_P8            base64 of the App Store Connect API key (.p8),
#                             role App Manager (Users and Access → Keys)
#   ASC_API_KEY_ID            the key's ID (e.g. 2X9R4HXF34)
#   ASC_API_ISSUER_ID         the issuer UUID shown on the same page
#   APPLE_TEAM_ID             the 10-char team id
#   VITE_REVENUECAT_IOS_KEY   RevenueCat App Store public SDK key (appl_…) —
#                             exists once the app is registered in App Store
#                             Connect and added to the RevenueCat project
#   VITE_GOOGLE_IOS_CLIENT_ID Google's iOS OAuth client id (warn-only:
#                             without it Google sign-in is hidden and Apple
#                             sign-in still works)
#
#   base64 -i dist.p12 | gh secret set IOS_DIST_CERT_P12 --env ios-build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # A dispatch is a rehearsal unless whoever starts it says otherwise —
      # android.yml's input, word for word, because it is the same decision
      # about the same kind of irreversible act. Nothing automated ticks this;
      # it is here for a human re-uploading a tag whose own run died after the
      # archive, which costs a build number and should therefore be a box.
      publish:
        description: "Upload the build to TestFlight (tag refs only)"
        type: boolean
        default: false

# NEVER CANCEL A TAG. Superseding a rehearsal is free; cancelling a tag run can
# land inside the upload, and a build number Apple has begun accepting is spent
# whichever side of the cancel it died on. A dispatch pinned to a tag shares
# this group with the tag's own run, so it queues behind it instead of killing
# it — same reasoning as android.yml, and desktop.yml never cancels at all.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  testflight:
    runs-on: macos-15
    environment: ios-build
    env:
      # WHETHER THIS RUN SHIPS. Computed once, because three steps below ask the
      # same question and three copies of it would drift — android.yml's
      # BUILD_APK for the same reason. Both halves are needed: the Actions UI
      # lets a dispatch pin itself to an existing v* tag, so the ref alone
      # cannot tell a release from a rehearsal aimed at one.
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # THE TAG AND THE COMMITTED VERSION HAVE TO AGREE. MARKETING_VERSION is
      # read out of app/package.json further down, which means a tag naming a
      # version this tree does not carry does not fail here — it uploads the
      # tree's version to TestFlight under the tag's name, and the build number
      # it spends doing so is spent for good. desktop.yml has asserted this
      # since the v1.0.3 incident (app/desktop/README.md, Versioning); iOS and
      # Android were left out of the fix, so the three workflows could disagree
      # about what a tag meant while each of them passed.
      #
      # First, and before `npm ci`: the script is two package.json reads with
      # node builtins, and macOS minutes bill at 10x. RELEASE_TAG is empty on a
      # dispatch, which reduces it to the check that the two committed versions
      # agree — worth having on a rehearsal too.
      - name: Check the version against the tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm --prefix desktop run check:version

      - name: Install dependencies
        run: npm ci

      # The image's DEFAULT Xcode trails what the App Store accepts: run #6
      # archived cleanly on the default (Xcode 16 / iOS 18.5 SDK) and the
      # upload validator refused it — "all apps must be built with the iOS 26
      # SDK or later". The runner ships several Xcodes side by side, so pick
      # the newest by version sort and say which, so the log answers "what SDK
      # did this build?" before Apple does.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Require signing and store secrets
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: |
          missing=0
          for name in IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the ios-build environment — see the header of .github/workflows/ios.yml."
              missing=1
            fi
          done
          # Same rule as android.yml's store-key guard: verify:store proves the
          # SDK survived tree-shaking, not that a key was set. A build without
          # the key ships with purchases silently disabled — and with the
          # tier-3 gate live, that is a build whose full game cannot be bought.
          if [ -z "$VITE_REVENUECAT_IOS_KEY" ]; then
            echo "::error::VITE_REVENUECAT_IOS_KEY is not set — a build made now would have no in-app purchases behind the tier-3 gate."
            missing=1
          fi
          if [ -z "$VITE_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_IOS_CLIENT_ID is not set — Google sign-in will be hidden on this build (Apple sign-in still works)."
          fi
          exit $missing

      - name: Typecheck + build web bundle
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: npm run build:native

      - name: Systems smoke test
        run: npm run test

      - name: Verify the store bundle
        run: npm run verify:store

      - name: Sync the iOS shell
        run: npx cap sync ios

      # A throwaway keychain so the Distribution key never touches the login
      # keychain, unlocked for the job and deleted with the runner.
      - name: Import signing certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$IOS_DIST_CERT_P12" | base64 -d > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm $RUNNER_TEMP/dist.p12

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_$ASC_API_KEY_ID.p8

      # MARKETING_VERSION tracks app/package.json (the same number the web and
      # desktop builds carry); the build number is the run number, which App
      # Store Connect requires to only ever go up.
      - name: Archive
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Integers only: App Store Connect rejects CFBundleShortVersionString
          # with any prerelease suffix ("1.0.1-alpha.1" failed run #5's upload
          # after a clean archive). The policy is plain major.minor.patch in
          # package.json from now on; the split is the belt to that policy's
          # suspenders, so a future -beta.N can never reach Apple.
          VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          # The target/scheme is "Tetrilaunch", not Capacitor's default "App":
          # Xcode 16+/26 mis-links apps whose target is named App (also UI*/
          # SwiftUI* prefixes) against SwiftUICore, which doesn't exist before
          # iOS 18 — dyld aborts at launch on iOS 16/17. Renaming the target
          # removes the bad strong link at the source (purchases-ios#7567).
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme Tetrilaunch \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/Tetrilaunch.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_API_KEY_ID.p8 \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # A PRIVACY MANIFEST THAT IS NOT IN THE BUNDLE IS NOT A PRIVACY MANIFEST,
      # and the failure is silent in both directions: a .xcprivacy that Xcode
      # does not copy produces a clean archive and ITMS-91053 mail from Apple
      # hours later, and a pbxproj that loses the reference (a `cap add ios`
      # regeneration would, along with the target rename docs/ios.md warns
      # about) looks like nothing at all. So ask the archive. Same shape as
      # desktop.yml asserting notarization rather than trusting a step that
      # warns and returns zero.
      - name: Verify the privacy manifest is in the bundle
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/Tetrilaunch.xcarchive/Products/Applications/Tetrilaunch.app/PrivacyInfo.xcprivacy"
          if [ ! -f "$manifest" ]; then
            echo "::error::PrivacyInfo.xcprivacy is not in the archived app. It exists at app/ios/App/App/PrivacyInfo.xcprivacy — check that project.pbxproj still lists it in the Tetrilaunch target's Resources build phase. Uploading without it invites ITMS-91053 (see docs/ios.md)."
            exit 1
          fi
          plutil -p "$manifest"

      # THE EXPORT RUNS EITHER WAY; ONLY THE UPLOAD IS WITHHELD. `destination`
      # in the options plist is the whole difference: `upload` hands the build
      # straight to App Store Connect from the export step (no ipa artifact, no
      # separate uploader tool), `export` writes the signed ipa to the runner
      # and sends nothing.
      #
      # A rehearsal has to include this half. Export is where manual signing is
      # actually exercised — resolving the "Tetrilaunch App Store" profile and
      # signing the payload — and it is where run #4 failed. A rehearsal that
      # stopped at the archive would prove the cheaper half and leave the
      # failure that has actually happened to a tag.
      - name: Export the archive, and upload it on a release
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then destination=upload; else destination=export; fi
          echo "export destination: $destination"

          cat > $RUNNER_TEMP/export-options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tetrilaunch.game</key><string>Tetrilaunch App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          # -exportPath only on the export path: the upload path has nothing to
          # write there, and the flag set that has been shipping releases is
          # left exactly as it was.
          args=(-exportArchive
            -archivePath "$RUNNER_TEMP/Tetrilaunch.xcarchive"
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"
            -allowProvisioningUpdates
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_API_KEY_ID.p8
            -authenticationKeyID "$ASC_API_KEY_ID"
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID")
          if [ "$destination" = "export" ]; then
            args+=(-exportPath "$RUNNER_TEMP/export")
          fi
          xcodebuild "${args[@]}"

      # A rehearsal leaves the thing it built, the way android.yml's does: the
      # signed ipa is the artifact worth inspecting, and it is also the evidence
      # that the export it just ran produced something.
      - name: Keep the rehearsal's signed ipa
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tetrilaunch-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      # Otherwise a rehearsal ends on a green export and reads like a run that
      # was cut short of its point. Say which half ran, in the log, where
      # whoever ticked nothing is looking.
      - name: Say that nothing was uploaded
        if: env.PUBLISH != 'true'
        run: |
          echo "::notice::Rehearsal: the app archived, signed and exported, and nothing reached TestFlight. The signed ipa is attached to this run. To ship, push a v* tag — or dispatch this workflow against one with the publish box ticked."

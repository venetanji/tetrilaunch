# ============================================================================
# BRANCH-LOCAL EDIT — integration/device-test ONLY. DO NOT MERGE.
#
# This branch exists to hand one installable APK to a device tester with three
# open PRs in it (#58 contracts + sandbox, #60 material notches, #61 rail), and
# the point of the build is the SANDBOX: without it a fresh save flies tier 1
# and offers none of the Contract variants, so the thing under test is
# unreachable. So the apk job below builds `--mode sandbox` instead of
# `--mode native` and passes --allow-sandbox to the bundle verifier.
#
# The resulting APK is NOT SHIPPABLE: it carries a menu screen that can set any
# Mark, grant salvage, max the rig and wipe the save. That is exactly why
# verify-store-bundle.mjs refuses it without the explicit flag, and why this
# edit must never reach staging.
# ============================================================================
name: Android debug APK

# Builds an installable debug APK so the native path stays provably working
# rather than documented-and-rotting. Runs on changes under app/ and on manual
# dispatch. Nothing is signed or published — release signing needs secrets that
# don't belong in the repo (see docs/NATIVE.md).
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: the Capacitor 8 CLI hard-fails with
          # "The Capacitor CLI requires NodeJS >=22.0.0".
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheap gates first: typecheck and the systems smoke test both fail in
      # seconds, long before Gradle spends minutes on a build that can't work.
      #
      # build:native, not build: `--mode native` is what disables the service
      # worker, and vite.config.ts spells out why a Capacitor build must not
      # carry one — `adb install -r` keeps app data, so the old worker survives
      # the update and serves the previous bundle out of its precache, with no
      # cache headers for the WebView to revalidate against. This job used to
      # run the plain web build, which put exactly that stale-code hazard into
      # the APK it hands out.
      - name: Typecheck + build web bundle
        run: npm run build:sandbox   # BRANCH-LOCAL: was build:native

      - name: Systems smoke test
        run: npm run test

      # Catches a build that dead-code-eliminated the RevenueCat SDK out of the
      # bundle — which is what happens if a store code path ever ends up gated
      # on an env-derived constant. CI has no keys, so this is exactly the
      # configuration that would hide the bug.
      - name: Verify the store bundle
        # BRANCH-LOCAL: the sandbox marker is deliberately present here, so the
        # verifier has to be told this bundle is not shippable.
        run: node scripts/verify-store-bundle.mjs --allow-sandbox

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 17: Capacitor 8's Android platform builds with AGP 8.13 and
          # sets source/targetCompatibility to VERSION_21.
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # app/android/ is gitignored (it's a derived artifact — see
      # docs/NATIVE.md), so CI generates it from capacitor.config.ts and the
      # installed plugins on every run. That also means this job is a real test
      # of `cap add` working from a clean checkout, not just of Gradle.
      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      # Re-applies the native edits `cap add` doesn't own (sticky immersive
      # MainActivity, display-cutout theme items, signing hook, real icons,
      # Auto Backup exclusions for the WebView service-worker store). Because
      # the platform is regenerated above, CI is also the thing that proves the
      # patch still applies against a freshly generated project — if Capacitor
      # changes the generated styles.xml or manifest, this step fails loudly
      # instead of silently shipping an APK with the system bars back over the
      # play field, or one whose backup restores stale code.
      - name: Apply native Android patches
        run: npm run patch:android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android

      - uses: actions/upload-artifact@v4
        with:
          name: tetrilaunch-SANDBOX-debug-apk-NOT-SHIPPABLE
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Signed .aab for Play. Manual dispatch and tags only — every push building a
  # release would burn versionCodes (Play rejects a code it has already seen, so
  # they are a one-way ratchet) and would touch the signing secrets far more
  # often than necessary.
  #
  # Requires four repo secrets; without them the job fails at the keystore step
  # rather than silently uploading an unsigned artifact:
  #
  #   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  #
  #   base64 -w0 upload-keystore.jks | gh secret set ANDROID_KEYSTORE_BASE64
  bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The RevenueCat public SDK keys are inlined by Vite at build time. A
      # release built without them ships with the store silently disabled — and
      # verify:store cannot catch that, because it only proves the SDK survived
      # tree-shaking, not that a key was set. Fail here instead.
      - name: Require store keys
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
        run: |
          if [ -z "$VITE_REVENUECAT_ANDROID_KEY" ]; then
            echo "::error::VITE_REVENUECAT_ANDROID_KEY is not set — a release built now would have no in-app purchases."
            exit 1
          fi

      - name: Typecheck + build web bundle
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
        run: npm run build:native

      - name: Systems smoke test
        run: npm run test

      - name: Verify the store bundle
        run: npm run verify:store

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Apply native Android patches
        run: npm run patch:android

      # Only the .jks itself has to reach the disk — it's a binary the JVM opens
      # by path. The passwords go to Gradle as environment variables instead of
      # being written into a keystore.properties, so they never land in a file
      # on the runner.
      - name: Write the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot produce a signed bundle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      # versionCode must strictly increase on every upload. run_number is
      # monotonic per workflow, which is the cheapest thing that satisfies Play.
      # A tag build takes its versionName from the tag (v1.2.3 -> 1.2.3).
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Optional: unset resolves to empty, and signing.gradle then falls
          # back to the store password — correct for a PKCS12 keystore, which
          # cannot hold a separate one. Only needed for a legacy JKS.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$ANDROID_VERSION_NAME" ]; then
            export ANDROID_VERSION_NAME="${ANDROID_VERSION_NAME#v}"
          else
            unset ANDROID_VERSION_NAME
          fi
          ./gradlew bundleRelease --no-daemon
        working-directory: app/android

      - name: Shred the keystore
        if: always()
        run: rm -f android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: tetrilaunch-release-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

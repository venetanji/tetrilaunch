name: Android build & release

# Builds an installable debug APK so the native path stays provably working
# rather than documented-and-rotting. Nothing is signed or published — release
# signing needs secrets that don't belong in the repo (see docs/NATIVE.md).
#
# THE GRADLE BUILD IS RATIONED, and the cheap gates are not.
#
# Every Gradle run resolves the whole AGP dependency tree from Maven Central
# afresh, and Central answers a busy repo with 429 Too Many Requests — which
# fails a build for reasons that have nothing to do with the code in it. This
# workflow was provoking that on its own: with an unfiltered `push` plus
# `pull_request`, one push to a PR branch fired the job TWICE, and a stack of
# open PRs meant a dozen Gradle runs an hour. #60 went red on a 429 while the
# identical commit passed on a retry, which is the shape of the whole problem —
# a red check nobody can act on teaches people to ignore red checks.
#
# So the expensive half now runs only where an actual APK is deliberately
# wanted: a hand-triggered dispatch. (A tag builds the signed bundle below
# instead, which is the artifact a tag is for.) Staging pushes and pull
# requests still run every cheap gate — typecheck, the systems smoke test, the
# store-bundle check — because those need no network beyond npm and catch
# nearly everything the APK step would. `push` is also branch-filtered
# so a PR stops being built twice, and `main` is not in the filter at all:
# main only ever moves by fast-forward from staging, so its sha was already
# gated when staging built it — a second run on the same commit under a
# different branch name says nothing. (Building an APK on every main push
# was the same waste one tier up: one debug APK per merge train, downloaded
# by nobody.)
#
# If you want an APK for a branch, dispatch it by hand; that is what the button
# is for.
#
# THE TAG IS THIS WORKFLOW'S OWN TRIGGER, and it is the only thing that can
# publish to Play.
#
# It used to arrive second-hand. desktop.yml's release job ran
# `gh workflow run android.yml --ref <tag> -f publish=true` after it had created
# the GitHub Release, because GitHub suppresses workflow runs for events raised
# by GITHUB_TOKEN — so the `release: published` that our own `gh release create`
# emits reaches nobody, and this workflow's `push` trigger was branch-filtered
# with no tags. That worked, and it made the whole Android release a dependent
# of a three-runner packaging matrix: the dispatch sat inside a job that is
# `needs: package` with no `always()`, so one failed leg skipped the dispatch
# and Android was never built at all — while ios.yml shipped the same tag to
# TestFlight and nothing anywhere reported that Play had been left out. That is
# not a hypothetical failure mode for this matrix: eleven of desktop.yml's
# eighteen runs have failed, the last three of them (13, 14, 17) on macOS
# signing and notarization, and run 18 only went green on its third attempt.
#
# So the tag comes straight here now, the way ios.yml and desktop.yml have
# always taken it, and desktop.yml dispatches nothing. Packaging and publishing
# are independent: either can fail without taking the other with it.
#
# EXACTLY ONE RUN PER TAG is the property that has to hold — `versionCode` is
# `run_number` and Play never gives a burned code back — so exactly one trigger
# can reach the `bundle` job with a tag ref. That is also why `release:
# published` is gone, and the run history is what settles it rather than a
# reading of the docs:
#
#   * A UI publish emits BOTH events. desktop.yml's runs 11 and 12 are one
#     v1.0.4 release, one `push` and one `release`, created one second apart —
#     the tag the publish created, and the publish. This workflow's own six
#     `release` runs (through v1.0.4) are the other side of those same pairs.
#   * A `git push` of the tag emits only `push`. v1.0.5 is the clean case:
#     desktop.yml run 16, `push`, with no paired `release` run anywhere,
#     because the release it then created came from GITHUB_TOKEN.
#
# So `push: tags` covers both ways in, once each, and adding `release:
# published` on top of it would make every UI publish two runs of this workflow
# for one release — two versionCodes of one versionName, the second of them
# burned for nothing. The tag is the thing both entry points have in common: a
# release cannot exist without one.
#
# NO `paths` FILTER ON `push` ANY MORE, and that is what the tag trigger costs.
# A paths filter is answered from a diff, and a newly created ref has no
# previous commit to diff against, so `tags:` plus `paths:` is at best
# version-dependent and at worst silently never runs — not a bet to take on the
# one event that carries a release. (ios.yml and desktop.yml both carry a bare
# `tags: ["v*"]` for the same reason.) The branch filter still stops a PR being
# built twice, `pull_request` keeps its paths filter, and the Gradle half is
# still rationed by BUILD_APK below — so the bill is the cheap gates running on
# a docs-only push to staging, which is minutes of ubuntu and no Maven traffic.
on:
  push:
    branches: [staging]
    tags: ["v*"]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      # A dispatch is a rehearsal unless whoever starts it says otherwise. The
      # Actions UI lets a human pick an existing v* tag as the ref, and the
      # publish gate below reads the ref — so without this input, choosing a
      # tag to rehearse against would turn the rehearsal into a release. The
      # tag path does not go through here at all any more, so this box is for
      # one case only: a human deliberately re-publishing a tag whose own run
      # died after the bundle was built. That is a second versionCode, which is
      # exactly why it is a box and not a default.
      publish:
        description: "Publish the bundle to the Play internal track (tag refs only)"
        type: boolean
        default: false

# A newer push to the same ref supersedes the running gate of a commit that
# will never ship — same rationing as ui-fit.yml.
#
# NEVER ON A TAG. Cancelling the gate run of a commit that will never ship
# costs nothing; cancelling a tag run can land between the Play upload and the
# artifact upload, and from the outside there is no telling which side of that
# line it died on. A tag ref and a dispatch pinned to the same tag now share
# this group, so the second one queues behind the first instead of killing it
# half-published.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    # Not on a tag. The `bundle` job below re-runs every one of these gates
    # against the same commit before it signs anything, so on the one event
    # that costs a versionCode this job is a duplicate — and a duplicate whose
    # failure would say nothing the release job had not already said.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    env:
      # Whether this run goes all the way to an APK, or stops after the cheap
      # gates. Computed once here so the steps below read as a single decision
      # rather than five copies of the same condition drifting apart. See the
      # rationing note at the top of the file. A dispatch is the only event
      # left that wants a debug APK: tags build the signed bundle instead, and
      # pushes and pull requests stop at the cheap gates.
      BUILD_APK: ${{ github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22+, not 20: the Capacitor 8 CLI hard-fails with
          # "The Capacitor CLI requires NodeJS >=22.0.0".
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheap gates first: typecheck and the systems smoke test both fail in
      # seconds, long before Gradle spends minutes on a build that can't work.
      #
      # build:native, not build: `--mode native` is what disables the service
      # worker, and vite.config.ts spells out why a Capacitor build must not
      # carry one — `adb install -r` keeps app data, so the old worker survives
      # the update and serves the previous bundle out of its precache, with no
      # cache headers for the WebView to revalidate against. This job used to
      # run the plain web build, which put exactly that stale-code hazard into
      # the APK it hands out.
      - name: Typecheck + build web bundle
        run: npm run build:native

      - name: Systems smoke test
        run: npm run test

      # Catches a build that dead-code-eliminated the RevenueCat SDK out of the
      # bundle — which is what happens if a store code path ever ends up gated
      # on an env-derived constant. CI has no keys, so this is exactly the
      # configuration that would hide the bug.
      - name: Verify the store bundle
        run: npm run verify:store

      - uses: actions/setup-java@v6
        if: env.BUILD_APK == 'true'
        with:
          distribution: temurin
          # 21, not 17: Capacitor 8's Android platform builds with AGP 8.13 and
          # sets source/targetCompatibility to VERSION_21.
          java-version: "21"

      - uses: android-actions/setup-android@v4
        if: env.BUILD_APK == 'true'

      # app/android/ is gitignored (it's a derived artifact — see
      # docs/NATIVE.md), so CI generates it from capacitor.config.ts and the
      # installed plugins on every run. That also means this job is a real test
      # of `cap add` working from a clean checkout, not just of Gradle.
      - name: Add Android platform
        if: env.BUILD_APK == 'true'
        run: npx cap add android

      - name: Sync web assets into the native project
        if: env.BUILD_APK == 'true'
        run: npx cap sync android

      # Re-applies the native edits `cap add` doesn't own (sticky immersive
      # MainActivity, display-cutout theme items, signing hook, real icons,
      # Auto Backup exclusions for the WebView service-worker store). Because
      # the platform is regenerated above, CI is also the thing that proves the
      # patch still applies against a freshly generated project — if Capacitor
      # changes the generated styles.xml or manifest, this step fails loudly
      # instead of silently shipping an APK with the system bars back over the
      # play field, or one whose backup restores stale code.
      - name: Apply native Android patches
        if: env.BUILD_APK == 'true'
        run: npm run patch:android

      - name: Build debug APK
        if: env.BUILD_APK == 'true'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android

      - uses: actions/upload-artifact@v7
        if: env.BUILD_APK == 'true'
        with:
          name: tetrilaunch-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Signed .aab for Play. Manual dispatch and tags only — every push building a
  # release would burn versionCodes (Play rejects a code it has already seen, so
  # they are a one-way ratchet) and would touch the signing secrets far more
  # often than necessary. A tag build also publishes to the INTERNAL track; a
  # dispatch is a rehearsal — it proves the signed bundle builds and leaves the
  # artifact to inspect, but pushing rehearsals to a track the owner's phone
  # auto-updates from would make every rehearsal a release. Production stays a
  # deliberate click in the Play Console: promotion is the irreversible half.
  #
  # The secrets live in the `android-build` ENVIRONMENT, not at repo scope —
  # same credential class, same job, and an environment can carry protection
  # rules (required reviewers, tag restrictions) that repo secrets cannot.
  # Without them the job fails at its guard steps rather than silently
  # uploading an unsigned artifact:
  #
  #   VITE_REVENUECAT_ANDROID_KEY  store key, inlined by Vite at build time
  #   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks)
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD         optional — PKCS12 reuses the store password
  #   PLAY_SERVICE_ACCOUNT_JSON    Google Cloud service account, granted
  #                                "Release to testing tracks" on this app only
  #
  #   base64 -w0 upload-keystore.jks | gh secret set ANDROID_KEYSTORE_BASE64 --env android-build
  bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Without this the job cannot see the android-build secrets at all — an
    # unbound job reads every one of them as empty and dies at the first guard.
    environment: android-build
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # THE TAG AND THE COMMITTED VERSION HAVE TO AGREE, and on Android that is
      # not a formality — it is the only cross-check there is. `versionName`
      # comes from the tag (see the bundle step below), so a tag that disagrees
      # with app/package.json does not fail: it publishes the tag's number to
      # Play against a tree that says something else, and the versionCode it
      # burns doing so never comes back. That is the v1.0.3 shape recorded in
      # app/desktop/README.md's Versioning section, where the guard was added to
      # desktop.yml alone and the other two workflows were left to disagree by
      # construction — iOS taking its number from app/package.json, Android from
      # the tag, neither of them looking at the other.
      #
      # It is the desktop package's script because that is where the version
      # pair already lives, and the question it answers ("does this tag name the
      # version this tree carries?") is the same question for all three
      # platforms. It reads two package.json files with node builtins, so it
      # needs no install and runs before `npm ci` — a mismatched tag costs
      # seconds here instead of a signed bundle later. RELEASE_TAG is empty on a
      # dispatch, which makes the script check only that the two committed
      # versions agree.
      - name: Check the version against the tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm --prefix desktop run check:version

      - name: Install dependencies
        run: npm ci

      # The RevenueCat public SDK keys are inlined by Vite at build time. A
      # release built without them ships with the store silently disabled — and
      # verify:store cannot catch that, because it only proves the SDK survived
      # tree-shaking, not that a key was set. Fail here instead.
      - name: Require store keys
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$VITE_REVENUECAT_ANDROID_KEY" ]; then
            echo "::error::VITE_REVENUECAT_ANDROID_KEY is not set — a release built now would have no in-app purchases."
            exit 1
          fi
          # Android sign-in runs Credential Manager against the WEB client id
          # (docs/AUTH.md). Without it the account screen hides itself and a
          # web purchase can never be recovered on this build.
          if [ -z "$VITE_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::VITE_GOOGLE_WEB_CLIENT_ID is not set — a release built now would have no sign-in."
            exit 1
          fi

      - name: Typecheck + build web bundle
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: npm run build:native

      - name: Systems smoke test
        run: npm run test

      - name: Verify the store bundle
        run: npm run verify:store

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Apply native Android patches
        run: npm run patch:android

      # Only the .jks itself has to reach the disk — it's a binary the JVM opens
      # by path. The passwords go to Gradle as environment variables instead of
      # being written into a keystore.properties, so they never land in a file
      # on the runner.
      - name: Write the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot produce a signed bundle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      # versionCode must strictly increase on every upload. run_number is
      # monotonic per workflow, which is the cheapest thing that satisfies Play.
      # A tag build takes its versionName from the tag (v1.2.3 -> 1.2.3).
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Optional: unset resolves to empty, and signing.gradle then falls
          # back to the store password — correct for a PKCS12 keystore, which
          # cannot hold a separate one. Only needed for a legacy JKS.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$ANDROID_VERSION_NAME" ]; then
            export ANDROID_VERSION_NAME="${ANDROID_VERSION_NAME#v}"
          else
            unset ANDROID_VERSION_NAME
          fi
          ./gradlew bundleRelease --no-daemon
        working-directory: app/android

      - name: Shred the keystore
        if: always()
        run: rm -f android/upload-keystore.jks

      # The artifact upload stays even though tags also publish below: a
      # publish that fails should still leave the bundle downloadable.
      - uses: actions/upload-artifact@v7
        with:
          name: tetrilaunch-release-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Same fail-loudly shape as "Require store keys": a missing secret should
      # report itself, not surface as an auth error from inside the action.
      #
      # The gate needs BOTH halves. The ref alone is not enough: the Actions UI
      # lets a dispatch pick an existing v* tag as its ref, and "a dispatch is
      # a rehearsal" must survive that — so a dispatch publishes only when its
      # publish input was ticked. A tag push arrives with the tag ref and no
      # inputs, and publishes; that is the automated path, and since the tag
      # trigger moved into this file it is the only one.
      - name: Require the Play service account
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — the bundle is built but cannot be published."
            exit 1
          fi

      # serviceAccountJsonPlainText, not serviceAccountJson: the latter wants a
      # path and fails unhelpfully when handed the JSON the secret holds. The
      # path is repo-root-relative because the action reads it directly — the
      # job's working-directory applies only to run: steps.
      - name: Publish to the internal track
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tetrilaunch.app
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

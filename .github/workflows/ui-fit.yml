name: UI fit

# Does every screen fit every device, in a real engine?
#
# A separate workflow from android.yml rather than another job in it: this one
# needs a browser and no Android SDK, that one needs the SDK and no browser, and
# neither should wait on the other's toolchain to report. It is also the faster
# of the two, so on a layout change it is the first thing to go red.
#
# See app/sim/README.md for what the harness asserts and how the baseline works.
#
# THIS WORKFLOW IS RATIONED, on android.yml's reasoning. An unfiltered `push`
# fired it for every push to every working branch — a merge-train session
# (branch pushes, the PR, staging, main) could queue six runs of two browser
# jobs each inside an hour, none of which said anything the PR run and the
# local ritual had not already said. So: pushes build only where the tree is
# authoritative (staging — main only moves by fast-forward from it), pull
# requests cover every working branch, and a superseded run is cancelled
# rather than finished for a commit nobody ships. A branch with no PR is validated by the local ritual; if you want CI
# on it anyway, that is what the dispatch button is for.
on:
  push:
    # staging only, no main: main only ever moves by fast-forward from
    # staging, so its sha was measured when staging built it — a second run
    # under a different branch name says nothing (android.yml's reasoning).
    branches: [staging]
    paths:
      - "app/src/**"
      - "app/sim/uifit/**"
      # The harness's numbers are font metrics and engine versions as much as
      # they are stylesheets: swapping a font file or bumping the pinned
      # Playwright build shifts measurements with no src/ change at all.
      - "app/public/fonts/**"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/ui-fit.yml"
  pull_request:
    paths:
      - "app/src/**"
      - "app/sim/uifit/**"
      - "app/public/fonts/**"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/ui-fit.yml"
  workflow_dispatch:

# A new push to the same ref supersedes the running measurement of a commit
# that will never ship, each ref in its own group.

concurrency:
  group: ui-fit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only. Playwright is pinned to an exact version in package.json
      # because every number this harness reports is a text-measurement result,
      # so a browser upgrade would shift the baseline for reasons that have
      # nothing to do with the app — `install` therefore fetches the one build
      # the baseline was recorded against. The cache keys on the lockfile for
      # the same reason: a Playwright bump is a new browser build, so it must
      # be a new cache entry. On a hit, `install` skips the download and only
      # the OS packages are fetched.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The headless-arithmetic tier first: it covers the layout solver with no
      # browser at all and fails in seconds.
      - name: Layout solver checks
        run: npm run test

      - name: UI fit across the device matrix
        run: npm run test:uifit

      # Screenshots for anything the assertions cannot express — reviewed by
      # eye on a layout PR, ignored otherwise. Only on failure: 250-odd PNGs is
      # not something to upload on every green run.
      - name: Screenshots
        if: failure()
        run: npm run test:uifit:shots || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: uifit-screenshots
          path: app/sim/results/uifit/
          retention-days: 7

  # The WebKit tier — the closest cheap proxy for the iOS WKWebView the six
  # iPhone/iPad rows actually ship in; without it every iOS row is tested in
  # Blink's rasteriser only. It asserts against its OWN baseline
  # (sim/uifit/baseline.webkit.json — the harness keys baselines per engine,
  # since every number is one engine's text measurement).
  #
  # GATING, which is what the two paragraphs this replaces promised for the
  # commit that landed the baseline. That file is recorded off a full local
  # WebKit matrix and holds 208 entries — and the shape of it is the argument
  # for gating: every one of the Chromium baseline's 190 keys is in there, the
  # same 181 `tap` and 9 `scrollers` rows restated in WebKit's numbers, and the
  # 18 extra are all `inkline`, the two Contract HUD fixtures on the nine
  # regular/roomy rows sitting 0.51-0.99px out of one optical line. That is
  # `--pixel-cap-drop` (derived from Chromium's actualBoundingBoxDescent)
  # meeting a rasteriser with a different one, which the commit that first
  # recorded a WebKit baseline already spelled out. Every phone row is clean
  # of it.
  #
  # What is NOT in it is the part worth stating: across all nineteen rows and
  # every screen, WebKit reports zero `fit`, zero `plant`, zero `clipped`,
  # zero `offscreen` and zero `safearea` — so no screen in this app fits in
  # Blink and overflows in WebKit, and the two engines' HUD panels agree to
  # under a pixel (WebKit's is the SHORTER of the two).
  #
  # It runs on pull requests again too. The old narrowing to staging pushes
  # and dispatch existed because an advisory-red job says nothing worth
  # spending a WebKit install on per PR sync. A gating one does: it is the
  # only tier in this repo that can catch an iOS-only regression before it
  # reaches a device, which is the whole reason the tier exists.
  fit-webkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: UI fit across the device matrix (WebKit)
        run: npm run test:uifit -- --engine=webkit

      - name: Screenshots
        if: failure()
        run: npm run test:uifit:shots -- --engine=webkit || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: uifit-webkit-screenshots
          path: app/sim/results/uifit/
          retention-days: 7

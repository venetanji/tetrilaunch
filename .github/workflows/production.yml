name: Deploy production worker

# Production is deliberately manual. Bind this job to a protected GitHub
# environment with a required reviewer so publishing tetrilaunch.com always
# represents an explicit release decision.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tetrilaunch.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Two tiers, same split as staging.yml explains at length: Google web
      # sign-in and RevenueCat are the floor and their absence is an error; the
      # iOS and Apple client ids are still being provisioned, and the client
      # hides each sign-in option whose id it was not built with, so an unset
      # one is a warning — the deploy is correct, just narrower.
      - name: Require deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_REVENUECAT_WEB_KEY: ${{ secrets.VITE_REVENUECAT_WEB_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_APPLE_WEB_CLIENT_ID: ${{ secrets.VITE_APPLE_WEB_CLIENT_ID }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN VITE_REVENUECAT_WEB_KEY VITE_GOOGLE_WEB_CLIENT_ID REVENUECAT_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment."
              exit 1
            fi
          done
          for name in VITE_GOOGLE_IOS_CLIENT_ID VITE_APPLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set — that sign-in option stays hidden until it is."
            fi
          done

      - name: Install workspace tooling
        run: npm ci

      # The VITE_ vars are inlined into the client build (which runs inside
      # this deploy via wrangler's build command): the public OAuth client ids
      # and the RevenueCat web billing key. GitHub secrets because that is
      # where per-environment configuration lives, not because they are
      # confidential.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_APPLE_WEB_CLIENT_ID: ${{ secrets.VITE_APPLE_WEB_CLIENT_ID }}
          VITE_REVENUECAT_WEB_KEY: ${{ secrets.VITE_REVENUECAT_WEB_KEY }}
        run: npx wrangler deploy

      # A new named Worker must exist before Wrangler can attach secrets. The
      # bulk upload creates a new Worker version immediately after the initial
      # deploy and keeps the RevenueCat secret key out of logs and config files.
      #
      # The client ids the Worker verifies token audiences against are the SAME
      # values the client build above inlined — one source, two consumers.
      # Built with node rather than printf so JSON-escaping is node's problem
      # and an unset id is ABSENT from the payload rather than uploaded as ""
      # (staging.yml states the full argument).
      - name: Configure Worker auth secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_APPLE_WEB_CLIENT_ID: ${{ secrets.VITE_APPLE_WEB_CLIENT_ID }}
        run: |
          node -e '
            const secrets = {
              REVENUECAT_SECRET_KEY: process.env.REVENUECAT_SECRET_KEY,
              GOOGLE_WEB_CLIENT_ID: process.env.VITE_GOOGLE_WEB_CLIENT_ID,
              GOOGLE_IOS_CLIENT_ID: process.env.VITE_GOOGLE_IOS_CLIENT_ID,
              APPLE_WEB_CLIENT_ID: process.env.VITE_APPLE_WEB_CLIENT_ID,
            };
            process.stdout.write(JSON.stringify(
              Object.fromEntries(Object.entries(secrets).filter(([, v]) => v)),
            ));
          ' | npx wrangler secret bulk

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- height=device-height is the half of the classic iPhone-X recipe this
         tag was missing (viewport-fit=cover being the famous half, present
         since the notch work). Without it WKWebView may size the LAYOUT
         viewport taller than the visible screen, and everything keyed to that
         height lays out with a band of itself below the glass — the shape of
         the HUD clip TestFlight 1.0.2 (7)-(11) showed on iOS 16. Browsers
         derive height from width and ignore this value, so the web build is
         unaffected. -->
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tetrilaunch</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are self-hosted (public/fonts/, refreshed by
         scripts/fetch-fonts.mjs). They used to come from fonts.googleapis.com
         at runtime, which sent the device IP to Google on every launch — a
         disclosable data flow on both stores — and left a cold, offline start
         rendering in the fallback stack.

         %BASE_URL% (not a leading "/") on purpose: vite.config sets
         `base: "./"`, so this resolves to ./fonts/fonts.css, exactly like the
         asset links Vite emits below it. An absolute /fonts/… would break any
         deployment that isn't at a domain root.

         Vite prints "./fonts/fonts.css doesn't exist at build time, it will
         remain unchanged to be resolved at runtime" for this line. That is
         expected and is the desired behaviour — files in public/ are copied
         verbatim and aren't in the source tree for Vite to resolve. -->
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

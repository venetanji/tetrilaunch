# Packaging for the desktop build: an NSIS installer, a dmg + zip, an AppImage —
# and, for Steam, the unpacked application directory those three are made from.
#
# Driven by `npm run desktop:dist` from app/, which builds the --mode native
# bundle first — see the `files` mapping below for why that ordering is not
# optional — and by .github/workflows/desktop.yml on a v* tag.
#
# Local macOS builds use an ad-hoc signature so they remain runnable without
# secrets. CI overrides the mac signing fields with the Developer ID identity,
# hardened runtime and notarization settings documented in desktop/README.md.
# Windows remains unsigned.

appId: com.tetrilaunch.game
# This intentionally matches the new Apple-team identifier used by the iOS
# target. Do not install the iOS-on-Mac build beside this Electron build: macOS
# keys Launch Services registration and per-app state on this value.
productName: Tetrilaunch
copyright: Copyright © 2026 Tetrilaunch

directories:
  output: release
  buildResources: build

# No publisher, and not merely "don't upload". Left unset, electron-builder
# infers a GitHub provider from the repository, then generates the
# latest-${os}.yml update manifests and an app-update.yml inside the package
# even under `--publish never` — and on a checkout it cannot infer a repo from,
# that path dies with `Cannot read properties of null (reading 'channel')`
# AFTER the artifact is already written, so the build reports failure over an
# installer that is sitting on disk and fine. There is no auto-updater here;
# the workflow uploads the files itself with `gh release upload`. Saying so
# explicitly skips the whole update-manifest stage.
publish: null

# The whole payload. Everything not listed is absent from the archive: this
# package has no runtime dependencies (electron and electron-builder are both
# devDependencies), so there is no node_modules to filter.
#
# The `from: ../dist` mapping is the packaging half of the two-location problem
# main.js documents. In a checkout the built bundle is app/dist/, a SIBLING of
# this package; a packaged app has no app/ around it, so the tree is copied in
# as `dist/` at the archive root and main.js resolves it relative to __dirname,
# which is the asar root once packaged. No copy step, no staging directory, and
# app/dist/ stays the single build output that Capacitor and the PWA also read.
files:
  - main.js
  - package.json
  - from: ../dist
    to: dist
    filter:
      - "**/*"

# The bundle stays inside the asar, audio included. ~32 MB of it is mp3, and
# protocol.handle already returns whole files rather than honouring range
# requests (see desktop/README.md), so unpacking the tracks would not buy
# streaming — it would only expose 29 MB of loose music files next to the
# executable for no gain.
asar: true

# No native modules anywhere in this package, so there is nothing to rebuild
# against Electron's ABI. Skipping it removes a node-gyp toolchain from the
# CI runners' critical path.
npmRebuild: false

win:
  # 7 sizes from 16 to 256, generated by scripts/make-icons.mjs and committed —
  # electron-builder would happily convert icon.png instead, but that emits a
  # lone 256px frame and Explorer's own downscale turns the neon strokes to
  # grey at the 16px the taskbar uses.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    # THE STEAM DEPOT'S CONTENT ROOT — see docs/STEAM.md's Phase 1 and
    # store/steam/README.md, which pins this path for the depot scripts.
    #
    # Steam is the installer. It downloads a depot's files into
    # steamapps/common/ and runs a binary named in the app's launch options, so
    # what a depot wants is the UNPACKED application directory, not the NSIS
    # setup above — upload the installer and the player receives a game whose
    # only content is a setup wizard.
    #
    # electron-builder already leaves that directory behind on every build, as
    # the staging area the installer is then made from. Declaring `dir` costs
    # nothing extra and changes what it is: a named output with a stable path,
    # rather than an intermediate that could be tidied away by a future version
    # without anyone noticing until a depot uploaded nothing.
    - target: dir
      arch: [x64]
  # Windows SmartScreen will warn about an unsigned installer on first run.
  # That is unavoidable without an EV certificate and is not something a build
  # flag can suppress; it is documented in desktop/README.md instead.

nsis:
  # Not a one-click installer. A one-click NSIS build installs to a fixed
  # per-user AppData path with no prompt at all, which for a game is exactly
  # the shape people mistake for malware — and it gives no way to put the
  # installed tree (313 MB unpacked on Linux; Windows is the same order)
  # somewhere other than the system drive.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, so no UAC elevation prompt. An unsigned installer asking for
  # administrator rights is a worse first impression than the SmartScreen
  # warning it already has to survive.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tetrilaunch
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

mac:
  icon: build/icon.png # electron-builder derives the .icns from this.
  category: public.app-category.games
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
    # The macOS depot's content root. Both arches, because unlike Windows and
    # Linux this platform has two, and electron-builder writes them to
    # DIFFERENT directories — `release/mac/` for x64 and `release/mac-arm64/`
    # for arm64 — each holding its own Tetrilaunch.app. Which of the two (or a
    # universal build of both) the depot actually ships is a Phase 5 decision
    # and is deliberately not made here; store/steam/README.md records it as
    # open rather than pretending one of the paths is canonical.
    - target: dir
      arch: [x64, arm64]
  # AD-HOC, NOT null. This is the one place where "no code signing" is the
  # wrong instruction. `identity: null` skips codesign entirely, and an
  # unsigned arm64 Mach-O does not merely warn on Apple Silicon — the kernel
  # refuses to exec it, so every Apple Silicon Mac would get a build that
  # cannot start. "-" is codesign's ad-hoc identity: no certificate, no
  # authority, but a valid signature, which is what arm64 actually requires.
  # Gatekeeper still blocks the download; desktop/README.md says how to get
  # past it.
  identity: "-"
  # Local default. The macOS CI leg overrides this to true after validating all
  # signing/notarization secrets.
  notarize: false
  # Local default paired with the ad-hoc identity. CI overrides it to true for
  # the Developer ID build.
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  # Local default; CI signs the dmg with the imported Developer ID certificate.
  sign: false
  title: Tetrilaunch ${version}

linux:
  # A directory, not build/icon.png — see the Linux block in
  # scripts/make-icons.mjs for why one 1024² file installs one 1024² icon and
  # leaves some application menus with a placeholder.
  icon: build/icons
  # Lowercase: the AppImage's inner binary and the .desktop Exec= line are
  # what a user types, and Tetrilaunch with a capital T is not it.
  executableName: tetrilaunch
  category: Game
  synopsis: Neon-arcade physics cannon puzzle
  # Overrides package.json's description, which explains to a developer why this
  # package exists and would otherwise land verbatim in the .desktop file's
  # Comment= — i.e. under the game's name in every Linux application menu.
  description: Fire blocks into orbit and clear the bays. A neon-arcade physics cannon puzzle.
  # Makes the installed .desktop file `tetrilaunch.desktop`, matching both
  # StartupWMClass and the app_id Electron reports. Without it a running window
  # is not linked to its launcher entry, so GNOME's dash shows the game twice —
  # once as the pinned icon, once as an unnamed generic window.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    # The Linux depot's content root, and the one that makes Steam Deck
    # possible at all. Its launch binary is `tetrilaunch`, lowercase — see
    # executableName above, and note that the depot's launch option must agree
    # with it or the app installs and never starts.
    - target: dir
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

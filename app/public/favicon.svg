<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tetrilaunch favicon - the "6a Rising Arc" mark reduced for 16-32px: the
       12.5% grid and the 45deg tile hatch are dropped because they alias into
       noise at tab size, and the corners are pre-rounded the way the old
       favicon was. Full-detail art lives in resources/icon.svg. -->
  <defs>
    <radialGradient id="bg" cx="32" cy="23.04" r="51.9781" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17173a"/><stop offset="0.78" stop-color="#07070f"/>
    </radialGradient>
    <filter id="tileGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.816" flood-color="#b026ff" flood-opacity="1"/>
    </filter>
    <filter id="dg0" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.96" flood-color="#00ff85" flood-opacity="0.32"/>
    </filter>
    <filter id="dg1" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.088" flood-color="#00ff85" flood-opacity="0.45"/>
    </filter>
    <filter id="dg2" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.216" flood-color="#00ff85" flood-opacity="0.61"/>
    </filter>
    <filter id="dg3" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.344" flood-color="#00ff85" flood-opacity="0.74"/>
    </filter>
    <filter id="dg4" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.472" flood-color="#00ff85" flood-opacity="0.83"/>
    </filter>
    <filter id="dg5" x="-200%" y="-200%" width="500%" height="500%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.6" flood-color="#00ff85" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g filter="url(#tileGlow)">
    <g transform="translate(9.92 16.32)"><rect x="0.44" y="0.44" width="13.2" height="13.2" rx="1.32" fill="#b026ff" stroke="#dd53ff" stroke-width="0.88"/></g>
    <g transform="translate(24.96 16.32)"><rect x="0.44" y="0.44" width="13.2" height="13.2" rx="1.32" fill="#b026ff" stroke="#dd53ff" stroke-width="0.88"/></g>
    <g transform="translate(40 16.32)"><rect x="0.44" y="0.44" width="13.2" height="13.2" rx="1.32" fill="#b026ff" stroke="#dd53ff" stroke-width="0.88"/></g>
    <g transform="translate(24.96 31.36)"><rect x="0.44" y="0.44" width="13.2" height="13.2" rx="1.32" fill="#b026ff" stroke="#dd53ff" stroke-width="0.88"/></g>
  </g>
  <g fill="#2f313c" fill-opacity="0.73">
    <rect x="23.936" y="19.456" width="1.152" height="7.872"/>
    <rect x="38.976" y="19.456" width="1.152" height="7.872"/>
    <rect x="28.096" y="30.336" width="7.872" height="1.152"/>
  </g>
  <circle cx="5.44" cy="58.56" r="0.96" fill="#00ff85" fill-opacity="0.35" filter="url(#dg0)"/>
  <circle cx="13.248" cy="56.448" r="1.088" fill="#00ff85" fill-opacity="0.5" filter="url(#dg1)"/>
  <circle cx="21.696" cy="54.336" r="1.216" fill="#00ff85" fill-opacity="0.68" filter="url(#dg2)"/>
  <circle cx="30.784" cy="52.544" r="1.344" fill="#00ff85" fill-opacity="0.82" filter="url(#dg3)"/>
  <circle cx="40.512" cy="51.264" r="1.472" fill="#00ff85" fill-opacity="0.92" filter="url(#dg4)"/>
  <circle cx="50.88" cy="50.624" r="1.6" fill="#00ff85" fill-opacity="1.0" filter="url(#dg5)"/>
</svg>

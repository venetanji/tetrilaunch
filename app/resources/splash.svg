<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!-- Launch-screen source. Square because Capacitor centre-crops the same
       image for every device aspect ratio, so the mark stays inside the middle
       third and everything outside it is flat background. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#12122c"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="2732" height="2732" fill="url(#bg)"/>
  <g transform="translate(1366 1366) scale(2.8) translate(-253 -270)" filter="url(#glow)" fill="none" stroke-linejoin="round">
    <rect x="70" y="266" width="96" height="96" rx="14" stroke="url(#g)" stroke-width="18"/>
    <path d="M172 300 Q300 40 442 320" stroke="#00ff85" stroke-width="12" stroke-dasharray="10 26" stroke-linecap="round"/>
    <rect x="372" y="262" width="70" height="70" rx="12" fill="#ffe500" stroke="#fff6a0" stroke-width="6"/>
  </g>
</svg>

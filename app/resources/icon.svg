<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App-store icon source. Same neon mark as public/icons/icon.svg, minus the
       "TETRI" wordmark: iOS renders the icon as small as 40px and small text
       turns to mush (and the wordmark needs Orbitron, which isn't available to
       the rasterizer). Regenerate the native asset catalogs with:
         npm run assets:generate      (app/, writes ios/App/App/Assets.xcassets) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#161636"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- The mark's ink bbox is x 61-445, y 169-371 in the 512-space it was drawn
       in; this centres that box on the 1024 canvas at ~81% width, inside the
       ~10% margin iOS masks away. -->
  <g transform="translate(512 512) scale(2.15) translate(-253 -270)" filter="url(#glow)" fill="none" stroke-linejoin="round">
    <rect x="70" y="266" width="96" height="96" rx="14" stroke="url(#g)" stroke-width="18"/>
    <path d="M172 300 Q300 40 442 320" stroke="#00ff85" stroke-width="12" stroke-dasharray="10 26" stroke-linecap="round"/>
    <rect x="372" y="262" width="70" height="70" rx="12" fill="#ffe500" stroke="#fff6a0" stroke-width="6"/>
  </g>
</svg>
